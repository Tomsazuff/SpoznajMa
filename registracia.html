<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrácia – SpoznajMa</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f5fa;
    color: #333;
}

header {
    background: linear-gradient(135deg, #d41470, #8e3fb4);
    color: white;
    text-align: center;
    padding: 28px 15px;
}

header h1 {
    margin: 0;
    font-size: 42px;
}

header p {
    margin: 10px 0 0;
    font-size: 23px;
}

nav {
    background: white;
    display: flex;
    justify-content: center;
    gap: 42px;
    padding: 25px 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

nav a {
    text-decoration: none;
    color: #7e32a2;
    font-weight: bold;
    font-size: 23px;
}

.container {
    max-width: 760px;
    margin: 70px auto;
    padding: 0 20px;
}

.card {
    background: white;
    border-radius: 30px;
    padding: 45px 55px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h2 {
    text-align: center;
    color: #8b32a9;
    font-size: 40px;
    margin-top: 0;
    margin-bottom: 40px;
}

label {
    display: block;
    font-size: 21px;
    font-weight: bold;
    margin: 25px 0 10px;
}

input {
    width: 100%;
    padding: 20px;
    border: 2px solid #ddd;
    border-radius: 18px;
    font-size: 19px;
    outline: none;
}

input:focus {
    border-color: #9b3bb5;
}

button {
    width: 100%;
    margin-top: 32px;
    padding: 20px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, #d41470, #8e3fb4);
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

.bottom {
    text-align: center;
    margin-top: 28px;
    font-size: 18px;
}

.bottom a {
    color: #8b32a9;
    font-weight: bold;
    text-decoration: none;
}

.message {
    text-align: center;
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 34px;
    }

    header p {
        font-size: 20px;
    }

    nav {
        gap: 22px;
        flex-wrap: wrap;
    }

    nav a {
        font-size: 19px;
    }

    .container {
        margin: 35px auto;
    }

    .card {
        padding: 30px 22px;
    }

    h2 {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SpoznajMa ❤️</h1>
    <p>Vytvor si účet</p>
</header>

<nav>
    <a href="index.html">Domov</a>
    <a href="profily.html">Profily</a>
    <a href="kredity.html">Kredity</a>
    <a href="prihlasenie.html">Prihlásenie</a>
</nav>

<div class="container">

    <div class="card">

        <h2>Registrácia</h2>

        <form id="registerForm">

            <label for="username">Meno alebo prezývka</label>
            <input
                type="text"
                id="username"
                placeholder="Tvoje meno alebo prezývka"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="tvoj@email.sk"
                required
            >

            <label for="password">Heslo</label>
            <input
                type="password"
                id="password"
                placeholder="Tvoje heslo"
                required
                minlength="6"
            >

            <button type="submit">Vytvoriť účet</button>

        </form>

        <div class="message" id="message"></div>

        <div class="bottom">
            Už máš účet?
            <a href="prihlasenie.html">Prihlás sa</a>
        </div>

    </div>

</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (password.length < 6) {
        document.getElementById("message").textContent =
            "Heslo musí mať aspoň 6 znakov.";
        return;
    }

    localStorage.setItem("spoznajma_username", username);
    localStorage.setItem("spoznajma_email", email);
    localStorage.setItem("spoznajma_password", password);
    localStorage.setItem("spoznajma_credits", "2");

    document.getElementById("message").textContent =
        "Účet bol vytvorený. Máš 2 kredity.";

    setTimeout(function() {
        window.location.href = "prihlasenie.html";
    }, 1000);
});
</script>

</body>
</html>
