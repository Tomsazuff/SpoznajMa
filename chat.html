<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpoznajMa – Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f3f6;
    color: #333;
}

header {
    background: linear-gradient(135deg, #8e44ad, #d63384);
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.credits {
    background: rgba(255,255,255,0.18);
    padding: 9px 14px;
    border-radius: 20px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 15px;
}

.profile {
    background: white;
    border-radius: 18px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 15px;
}

.profile img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 50%;
}

.profile h2 {
    margin: 0 0 5px;
    color: #8e44ad;
}

.profile p {
    margin: 0;
    color: #777;
}

.notice {
    background: #fff4fb;
    border: 1px solid #f0c7df;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 13px;
}

.chat {
    background: white;
    border-radius: 18px;
    padding: 20px;
    min-height: 430px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.messages {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* MUŽ – VĽAVO */
.message.man {
    align-self: flex-start;
    background: #eeeeee;
    color: #333;
    border-radius: 16px 16px 16px 4px;
    padding: 11px 14px;
    max-width: 75%;
}

/* LUCIA / ŽENA – VPRAVO */
.message.lucia {
    align-self: flex-end;
    background: #8e44ad;
    color: white;
    border-radius: 16px 16px 4px 16px;
    padding: 11px 14px;
    max-width: 75%;
}

.sender {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
    opacity: 0.8;
}

.message-text {
    font-size: 15px;
    line-height: 1.4;
}

.composer {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.composer input {
    flex: 1;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
}

.composer button {
    border: none;
    background: #8e44ad;
    color: white;
    padding: 0 20px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}

.composer button:hover {
    background: #74358f;
}

.actions {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.back {
    color: #8e44ad;
    text-decoration: none;
    font-weight: bold;
}

.panic {
    background: #d63384;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

@media (max-width: 600px) {

    header {
        padding: 14px;
    }

    .logo {
        font-size: 20px;
    }

    .container {
        margin-top: 12px;
    }

    .chat {
        padding: 14px;
    }

    .message.man,
    .message.lucia {
        max-width: 85%;
    }

    .composer {
        flex-direction: column;
    }

    .composer button {
        height: 45px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        SpoznajMa
    </div>

    <div class="credits">
        Kredity:
        <span id="credits">2</span>
    </div>

</header>


<div class="container">

    <div class="profile">

        <img
            id="profileImage"
            src="images/lucia-1.jpg"
            alt="Profil"
        >

        <div>

            <h2 id="profileName">
                Lucia, 29
            </h2>

            <p id="profileCity">
                Bratislava
            </p>

        </div>

    </div>


    <div class="notice">
        Tento profil je virtuálny a komunikácia je moderovaná.
    </div>


    <div class="chat">

        <div
            class="messages"
            id="messages"
        >

            <!-- MUŽ – VĽAVO -->

            <div class="message man">

                <div class="sender">
                    On
                </div>

                <div class="message-text">
                    Ahoj 😊 Ako sa dnes máš?
                </div>

            </div>


            <!-- ŽENA – VPRAVO -->

            <div class="message lucia">

                <div class="sender" id="femaleSender">
                    Lucia
                </div>

                <div class="message-text">
                    Ahoj 😊 Mám sa dobre. A ty?
                </div>

            </div>


        </div>


        <div class="composer">

            <input
                type="text"
                id="messageInput"
                placeholder="Napíš správu..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Odoslať
            </button>

        </div>


        <div class="actions">

            <a
                class="back"
                href="profily.html"
            >
                ← Späť
            </a>

            <button
                class="panic"
                onclick="panicRoom()"
            >
                🚨 Panic Room
            </button>

        </div>

    </div>

</div>


<script>

/*
==================================================
PROFILY
==================================================
*/

const profiles = {

    lucia: {
        name: "Lucia",
        age: 29,
        city: "Bratislava",
        image: "images/lucia-1.jpg"
    },

    nina: {
        name: "Nina",
        age: 31,
        city: "Košice",
        image: "images/nina-1.jpg"
    },

    veronika: {
        name: "Veronika",
        age: 27,
        city: "Žilina",
        image: "images/veronika-1.jpg"
    },

    petra: {
        name: "Petra",
        age: 34,
        city: "Trnava",
        image: "images/petra-1.jpg"
    },

    monika: {
        name: "Monika",
        age: 30,
        city: "Nitra",
        image: "images/monika-1.jpg"
    },

    sandra: {
        name: "Sandra",
        age: 26,
        city: "Banská Bystrica",
        image: "images/sandra-1.jpg"
    },

    katarina: {
        name: "Katarína",
        age: 32,
        city: "Prešov",
        image: "images/katarina-1.jpg"
    },

    simona: {
        name: "Simona",
        age: 28,
        city: "Poprad",
        image: "images/simona-1.jpg"
    },

    alexandra: {
        name: "Alexandra",
        age: 30,
        city: "Trenčín",
        image: "images/alexandra-1.jpg"
    },

    bianka: {
        name: "Bianka",
        age: 28,
        city: "Zvolen",
        image: "images/bianka-1.jpg"
    }

};


/*
==================================================
ZISTENIE PROFILU Z URL
==================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );

let profileId =
    params.get("meno");


/*
Ak profil nie je uvedený,
použije sa Lucia.
*/

if (
    !profileId ||
    !profiles[profileId]
) {
    profileId = "lucia";
}


const profile =
    profiles[profileId];


/*
==================================================
NASTAVENIE PROFILU
==================================================
*/

document.getElementById(
    "profileImage"
).src =
    profile.image;


document.getElementById(
    "profileImage"
).alt =
    profile.name;


document.getElementById(
    "profileName"
).textContent =
    profile.name +
    ", " +
    profile.age;


document.getElementById(
    "profileCity"
).textContent =
    profile.city;


document.getElementById(
    "femaleSender"
).textContent =
    profile.name;


/*
==================================================
KREDITY – SAMOSTATNÉ PRE KAŽDÝ PROFIL
==================================================
*/

/*
Príklad:

spoznajma_credits_lucia
spoznajma_credits_nina
spoznajma_credits_pet ra
atď.

Každý profil má vlastný zostatok.
*/

const creditKey =
    "spoznajma_credits_" +
    profileId;


let credits =
    localStorage.getItem(
        creditKey
    );


/*
Ak tento profil ešte nemá
uložené kredity, dostane 2.
*/

if (
    credits === null
) {

    credits = 2;

    localStorage.setItem(
        creditKey,
        credits
    );

} else {

    credits =
        Number(credits);

}


/*
Zobrazenie kreditov
*/

function updateCredits() {

    document.getElementById(
        "credits"
    ).textContent =
        Number(credits).toFixed(1);

}

updateCredits();


/*
==================================================
ODOSLANIE SPRÁVY
==================================================
*/

function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    /*
    Jedna správa = 0,5 kreditu
    */

    if (credits < 0.5) {

        alert(
            "Nemáš dostatok kreditov pre tento profil."
        );

        return;
    }


    /*
    Odpočítanie
    */

    credits =
        credits - 0.5;


    /*
    Uloženie PRE KONKRÉTNY PROFIL
    */

    localStorage.setItem(
        creditKey,
        credits
    );


    updateCredits();


    /*
    Vytvorenie správy Lucie / ženy
    */

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message lucia";


    message.innerHTML = `

        <div class="sender">
            ${escapeHtml(profile.name)}
        </div>

        <div class="message-text">
            ${escapeHtml(text)}
        </div>

    `;


    document
        .getElementById("messages")
        .appendChild(message);


    input.value = "";


    message.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

}


/*
==================================================
OCHRANA TEXTU
==================================================
*/

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}


/*
==================================================
ENTER = ODOSLAŤ
==================================================
*/

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/*
==================================================
PANIC ROOM
==================================================
*/

function panicRoom() {

    const confirmed =
        confirm(
            "Panic Room ukončí túto konverzáciu. Pokračovať?"
        );


    if (confirmed) {

        window.location.href =
            "profily.html";

    }

}

</script>

</body>
</html>
